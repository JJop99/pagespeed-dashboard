<VirtualHost *:80>

    ServerName pagespeed.mumble
    DocumentRoot /var/www/pagespeed/public

    <Directory /var/www/pagespeed/public>
        Options FollowSymLinks MultiViews
        Order Allow,Deny
        Allow from all
        ReWriteEngine On
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

</VirtualHost>
